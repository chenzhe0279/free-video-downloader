[project]
name = "free-video-downloader-backend"
version = "0.1.0"
description = "万能视频下载站后端：基于 yt-dlp 的解析、合并、本地交付与去水印"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "yt-dlp>=2024.12.13",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "imageio-ffmpeg>=0.5.1",
    "stripe>=15,<16",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.14,<2",
    "pymysql[rsa]>=1.1,<2",
    "argon2-cffi>=23,<26",
    "email-validator>=2,<3",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
